[project]
name = "claude-skill-writing"
version = "0.1.0"
description = "A writing skill for Claude with a draft checker"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "vulture>=2.16",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, and test tables use literal values.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["writing/scripts", "install.py", "tests"]
mypy_path = ["writing/scripts", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["writing/scripts", "."]
